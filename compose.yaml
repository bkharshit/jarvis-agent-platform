services:
  postgres:
    # S8 (ADR 0020): the pgvector image so migration 0014's
    # `CREATE EXTENSION vector` works wherever Docker IS used. (Local
    # development on this machine is Homebrew Postgres, no Docker.)
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - jarvis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jarvis-pgdata: