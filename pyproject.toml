[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — an open-source, production-grade AI agent platform"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "typer>=0.13",
    "rich>=13.9",
    "httpx>=0.28",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260815",
]

[project.scripts]
jarvis = "jarvis.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: integration tests that require PostgreSQL (deselected by default)",
]
addopts = "-m 'not db'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# Typer requires Option/Argument calls in parameter defaults (B008).
"src/jarvis/cli/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "jarvis.domain.*"
strict = true

[[tool.mypy.overrides]]
module = "jarvis.ports.*"
strict = true
